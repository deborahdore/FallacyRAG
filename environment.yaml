name: rags
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - seaborn
  - matplotlib
  - scikit-learn
  - pip:
      - torch
      - transformers
      - "accelerate>=1.1.0"
      - bitsandbytes
      - datasets
      - sentence-transformers
      - rootutils
      - tqdm
      - requests
      - beautifulsoup4
      - lxml
      - playwright
      - pytesseract
      - pdf2image
      - easyocr
      - langchain-core
      - langchain-community
      - langchain-text-splitters
      - langchain-huggingface
      - langchain-chroma
