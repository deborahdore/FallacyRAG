name: transformers
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - pip:
      # modelling and fine-tuning
      - torch
      - xformers  # required by NeoBERT
      - transformers
      - "accelerate>=1.1.0"
      - bitsandbytes
      - datasets
      - peft
      - trl
      - sentence-transformers
      - openai
      # retrieval and knowledge base
      - langchain-core
      - langchain-community
      - langchain-text-splitters
      - langchain-huggingface
      - langchain-chroma
      - chromadb
      - bm25s
      - rank-bm25
      - nltk
      - spacy
      - "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
      # scraping and OCR
      - requests
      - beautifulsoup4
      - playwright
      - scholarly
      - pytesseract
      - pdf2image
      - easyocr
      # utilities
      - rootutils
      - tqdm
      - wandb
      # notebooks only
      - faiss-cpu
      - wordcloud
      - tweet-preprocessor
